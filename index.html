
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration Form</title>
    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="container" id="formContainer">
        <h1>Online Registration Form</h1>
        <p class="subtitle">Please fill in your details below</p>

        <form id="registrationForm">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required
                       placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required
                       placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" pattern="[0-9]{10}"
                       maxlength="10" required
                       placeholder="Enter 10-digit phone number">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                    <option>Prefer not to say</option>
                </select>
            </div>

            <div class="form-group">
                <label for="course">Course / Application Type</label>
                <select id="course" required>
                    <option value="">Select an option</option>
                    <option>BCA</option>
                    <option>BSc Computer Science</option>
                    <option>BCom</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="3" required
                          placeholder="Enter your address"></textarea>
            </div>

            <button type="submit">Submit Application</button>
            <button type="reset" class="reset-btn">Reset Form</button>

        </form>
    </div>

    <!-- Submitted details will appear here -->
    <div class="container result-container" id="resultContainer"
         hidden>
        <h1>Application Submitted!</h1>
        <p class="success-message">
            Your registration details are shown below.
        </p>

        <div id="result"></div>

        <button type="button" id="backButton">
            Back to Registration Form
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
